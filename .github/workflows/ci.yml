name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MOCK_AI: "true"
      APP_URL: "http://localhost:3000"
      GEMINI_MODEL: "gemini-3-pro-preview"
      SESSION_SECRET: "ci-only-secret-with-enough-length-123456"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm audit --omit=dev
      - run: npm run build
